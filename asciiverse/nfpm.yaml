# System packages (.deb, .rpm, .apk, Arch) for sl, built by nfpm from the
# same static Linux build as the av archive. The release workflow sets
# VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64).
# No .desktop file on purpose: av is the one place titles are started from.
name: sl
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/sl
license: SL
description: |
  A steam locomotive runs across your terminal when you type "sl" for "ls".
  sl by Toyoda Masashi, packaged by Asciiverse.
contents:
  - src: sl
    dst: /usr/bin/sl
    file_info: { mode: 0755 }
  - src: sl.1
    dst: /usr/share/man/man1/sl.1
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/sl/copyright
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/sl/README.md
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/sl/PATCHES.md
    file_info: { mode: 0644 }
